name : Checks

on : push

jobs: 
  Validate-HTML:
    runs-on : ubuntu-latest
    steps:
        - name: Checks
          uses: actions/checkout@v4

        - name: Validate html
          run: test -f .github/index.html


  Validate-JS:
    runs-on : ubuntu-latest
    steps:
        - name: Checks
          uses: actions/checkout@v4

        - name: Validate html
          run: test -f .github/script.js


  Validate-both:
    needs: [Validate-HTML, Validate-JS]
    runs-on : ubuntu-latest
    steps:
        - name: Checks
          uses: actions/checkout@v4

        - name: Validate html
          run: test -f .github/index.html